services:
  intelligence:
    image: sak-haber-intelligence:latest
    build:
      context: ..
      dockerfile: deploy/worker.Dockerfile
    env_file:
      - ../.env.worker
    environment:
      NODE_ENV: production
      NEWS_CONCURRENCY: ${NEWS_CONCURRENCY:-2}
    command: ['pnpm', 'start', '--intelligence', '--scheduler']
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    mem_limit: 1536m
    cpus: 2
    pids_limit: 128
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
